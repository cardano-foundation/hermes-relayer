name: Rust
on:
  pull_request:
    paths:
      - .github/workflows/rust.yml
      - Cargo.toml
      - Cargo.lock
      - ci/**
      - e2e/**
      - crates/**
      - tools/**
  push:
    branches: [master, main]
    paths:
      - .github/workflows/rust.yml
      - Cargo.toml
      - Cargo.lock
      - ci/**
      - e2e/**
      - crates/**
      - tools/**

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 1
  CARGO_PROFILE_RELEASE_DEBUG: 1
  RUST_BACKTRACE: short
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

# Cancel previous runs of this workflow when a new commit is added to the PR, branch or tag
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # RocksDB 8.1.1 bundled by the Penumbra backend does not compile with the
  # Ubuntu 26.04 C++ headers. Match the integration jobs' native build image.
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-all-features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clippy all features
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  clippy-no-default-features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Clippy without default features
        run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings

  # Workspace-wide builds always enable every chain backend, because the test
  # framework requires them, so check the default build and each opt-in
  # backend in isolation.
  clippy-chain-backends:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [none, penumbra, namada]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clippy chain backend
        run: >-
            cargo clippy
            -p ibc-relayer-cli -p ibc-relayer-rest -p ibc-chain-registry
            --no-default-features
            ${{ matrix.backend != 'none' && format('--features ibc-relayer-cli/{0}', matrix.backend) || '' }}
            --all-targets -- -D warnings

  test-stable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - run: cargo test --workspace --all-features --no-fail-fast --no-run
      - run: cargo nextest run --all-features --no-fail-fast --workspace --exclude ibc-integration-test --no-capture

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-msrv
        run: cargo install --locked --version 0.17.1 cargo-msrv
      - name: Check MSRV
        run: cargo msrv verify --output-format json --manifest-path crates/relayer-cli/Cargo.toml

